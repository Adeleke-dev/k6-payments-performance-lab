name: Performance Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  smoke-test:
    name: k6 Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build
        
      - name: Prepare results directories
        run: |
          mkdir -p results/json results/summaries
          chmod -R 777 results

      - name: Run k6 smoke test
        run: docker compose up --abort-on-container-exit --exit-code-from k6